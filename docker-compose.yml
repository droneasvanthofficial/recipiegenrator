version: '3.8'

services:
  recipe-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipe-generator
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_GROQ_API_KEY=${NEXT_PUBLIC_GROQ_API_KEY}
      - API_TIMEOUT_MS=${API_TIMEOUT_MS:-30000}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - recipe-network

  # Optional: nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: recipe-generator-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - recipe-generator
    networks:
      - recipe-network
    restart: unless-stopped

networks:
  recipe-network:
    driver: bridge
